# =============================================================================
# AEGIS - Adaptive Behavioral Threat Detection for IT/OT Systems
# Single source of truth for all tunable parameters.
#
# RULES:
#   * No magic numbers in code. If a number affects behaviour, it lives here.
#   * Every value that is a prototype calibration choice (rather than a learned
#     or derived quantity) is explicitly commented as such.
#   * Changing `seed.master` must change every downstream stochastic component
#     in a reproducible way (see src/utils/seeding.py).
# =============================================================================

project:
  name: AEGIS
  full_name: "Adaptive Behavioral Threat Detection for IT/OT Systems"
  version: "0.1.0"

# -----------------------------------------------------------------------------
# Determinism. One master seed; every component derives an independent, stable
# substream from it so that adding a new component never shifts existing ones.
# -----------------------------------------------------------------------------
seed:
  master: 20260725
  strict: true          # if true, code paths that would use unseeded randomness raise

# -----------------------------------------------------------------------------
# Filesystem layout (relative to project root; resolved in src/paths.py)
# -----------------------------------------------------------------------------
paths:
  data_raw: data/raw
  data_processed: data/processed
  data_generated: data/generated
  models: models
  artifacts: artifacts        # evaluation figures, metric json, alert stores
  docs: docs

# -----------------------------------------------------------------------------
# Synthetic environment (Phase 2/3 refine the internals; population + volume
# knobs are fixed here so dev runs and full runs differ only by profile name).
# -----------------------------------------------------------------------------
generator:
  profile: dev                # dev | full  -> selects a block from `profiles`

  profiles:
    dev:
      n_users: 40
      n_service_accounts: 8
      n_edge_devices: 12
      days: 21
      target_events: 20000
    full:
      n_users: 220
      n_service_accounts: 40
      n_edge_devices: 60
      days: 90
      target_events: 250000

  start_date: "2025-01-06"    # a Monday, so weekday/weekend logic is easy to reason about

  # Fraction of *events* that belong to an injected attack campaign.
  # Realistic SOC prevalence: well under 3%.
  attack_prevalence: 0.015

  # Relative mix of injected campaigns. Normalised at generation time.
  # insider_drift is an EDGE CASE (ambiguous, not a hard attack) and is used for
  # false-positive tuning and concept-drift demonstration.
  attack_mix:
    brute_force: 0.22
    impossible_travel: 0.14
    credential_stuffing: 0.18
    lateral_movement: 0.16
    device_spoofing: 0.12
    low_and_slow_exfiltration: 0.10
    insider_drift: 0.08

  # Statistical noise applied to otherwise habitual behaviour so that "normal"
  # is not unrealistically deterministic. Prototype calibration values.
  noise:
    hour_jitter_std: 1.2          # hours, gaussian around the entity's typical login hour
    off_profile_resource_prob: 0.04
    off_profile_location_prob: 0.02
    secondary_device_prob: 0.08
    benign_auth_failure_rate: 0.03  # fat-fingered passwords etc.

# -----------------------------------------------------------------------------
# Behavioral feature engineering windows
# -----------------------------------------------------------------------------
features:
  freq_windows_minutes: [5, 60]
  failed_auth_windows_minutes: [5, 30]
  resource_breadth_window_hours: 24
  # Minimum plausible commercial travel speed used for impossible-travel logic.
  # 900 km/h cruise + generous allowance for airport/ground time.
  max_plausible_kmh: 900.0

# -----------------------------------------------------------------------------
# Entity profiling + cold start
# -----------------------------------------------------------------------------
profiling:
  # Number of observed events at which a personal profile is considered mature
  # (profile_confidence -> 1.0). Blending is cohort-weighted below this.
  maturity_events: 60
  min_events_for_personal: 5
  # Exponential decay half-life for behavioural statistics (concept drift).
  ewma_halflife_days: 14
  cohort_keys: [entity_type, role]

# -----------------------------------------------------------------------------
# Concept drift / adaptive baselines
# -----------------------------------------------------------------------------
drift:
  # Events scoring at or above this risk are NOT absorbed into the baseline,
  # preventing an attacker from poisoning the entity profile.
  baseline_update_max_risk: 40
  rolling_window_days: 30

# -----------------------------------------------------------------------------
# Models
# -----------------------------------------------------------------------------
models:
  anomaly_detector:
    type: isolation_forest
    n_estimators: 300
    max_samples: auto
    contamination: 0.02        # aligned with configured attack prevalence + noise
    n_jobs: -1

  attack_classifier:
    type: random_forest
    n_estimators: 400
    max_depth: 18
    min_samples_leaf: 3
    class_weight: balanced_subsample
    n_jobs: -1

# -----------------------------------------------------------------------------
# Risk engine. WEIGHTS ARE PROTOTYPE CALIBRATION PARAMETERS, NOT LEARNED VALUES.
# They are documented as such in the report; they sum to 1.0 before scaling to
# a 0-100 analyst-facing score.
# -----------------------------------------------------------------------------
risk:
  weights:
    ml_anomaly: 0.35           # IsolationForest normalised score
    behavioral_deviation: 0.25 # deviation from the entity's own baseline
    sequence_anomaly: 0.15     # Markov transition improbability
    classifier_confidence: 0.15
    rule_signals: 0.10         # deterministic security-critical triggers
  # Multiplier applied for the sensitivity of the accessed asset.
  asset_sensitivity_boost:
    low: 1.0
    medium: 1.10
    high: 1.25
    critical: 1.40
  severity_bands:
    LOW: [0, 30]
    MEDIUM: [31, 60]
    HIGH: [61, 80]
    CRITICAL: [81, 100]

# -----------------------------------------------------------------------------
# Alerting / analyst budget
# -----------------------------------------------------------------------------
alerting:
  # A real SOC cannot triage more than a tiny fraction of events. Recall is
  # therefore always reported *within this budget*, not at an arbitrary threshold.
  budget_fraction: 0.01
  max_explanation_factors: 6

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  # TEMPORAL split only. Random splitting would leak future behaviour of an
  # entity into the training window.
  train_fraction: 0.70
  primary_metric: pr_auc
  report_metrics: [precision, recall, f1, pr_auc, roc_auc, fpr, recall_at_budget]
